<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDP 홀 펀칭</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
      --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3ae; --line: #2a2f38;
        --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 4px 0 12px; }
    h2 { font-size: 14px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .me { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .me .right { text-align: right; }
    .label { font-size: 12px; color: var(--muted); }
    .name { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
    ul { list-style: none; margin: 0; padding: 0; }
    li.peer { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    li.peer:first-child { border-top: 0; }
    .peer .info { flex: 1; min-width: 0; }
    .status { font-size: 12px; margin-top: 2px; word-break: break-all; }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.err { color: var(--err); }
    .status.muted { color: var(--muted); }
    .badge { display: inline-block; font-size: 11px; font-weight: 400; padding: 0 6px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); margin-left: 6px; vertical-align: 1px; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
    details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    pre#log { white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 8px 0 0; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <h1>UDP 홀 펀칭</h1>

    <section class="card me">
      <div>
        <div class="label">내 기기</div>
        <div class="name" id="me-name">-</div>
        <div class="label" id="me-device"></div>
      </div>
      <div class="right">
        <div class="label">내 공인 주소</div>
        <div class="mono" id="me-ip">확인 중…</div>
        <div class="label" id="lobby-status">접속 중…</div>
      </div>
    </section>

    <section class="card">
      <h2>접속 중인 기기</h2>
      <ul id="peers"></ul>
      <div class="empty" id="empty">다른 기기에서 이 페이지를 열면 여기에 나타납니다.</div>
    </section>

    <section class="card">
      <details>
        <summary>로그</summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";

    // ===== 설정 =====
    // publishable key는 공개용 키다. secret / service_role 키는 절대 넣지 않는다.
    const SUPABASE_URL = "https://eicrrxgnwehjutvjcnsp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qoSTNryoQgXk-9OwqRPbbQ_pAsaF3p1";
    const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];
    const GATHER_TIMEOUT_MS = 5000;
    const CONNECT_TIMEOUT_MS = 20000;

    // ===== 공통 =====
    const $ = (id) => document.getElementById(id);
    function log(msg) {
      $("log").textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      console.log(msg);
    }
    const run = (fn) => (...args) => Promise.resolve().then(() => fn(...args)).catch((e) => log(`오류: ${e.message}`));

    // crypto.randomUUID는 HTTPS에서만 동작하므로 HTTP에서도 되는 getRandomValues로 만든다.
    const newId = (n = 8) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, "0")).join("");
    const pick = (arr) => arr[crypto.getRandomValues(new Uint8Array(1))[0] % arr.length];

    function deviceLabel() {
      const ua = navigator.userAgent;
      const os = /Android/.test(ua) ? "Android" : /iPhone|iPad|iPod/.test(ua) ? "iOS"
        : /Mac OS X/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "기타";
      const br = /SamsungBrowser/.test(ua) ? "Samsung" : /Edg\//.test(ua) ? "Edge"
        : /CriOS|Chrome/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "브라우저";
      return `${os} · ${br}`;
    }

    const me = {
      id: newId(),
      name: `${pick(["파란", "빨간", "노란", "초록", "보라", "하얀", "까만", "주황"])} ${pick(["고양이", "강아지", "여우", "판다", "토끼", "펭귄", "고래", "다람쥐"])}`,
      device: deviceLabel(),
      ip: null,
    };
    $("me-name").textContent = me.name;
    $("me-device").textContent = me.device;

    // ===== 펀칭 (RTCPeerConnection + DataChannel) =====
    class Punch {
      constructor(isCaller, tag, onState) {
        this.isCaller = isCaller;
        this.tag = tag;
        this.onState = onState;
        this.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        this.pc.onicecandidate = (e) => {
          if (e.candidate) log(`[${tag}] 로컬 후보: ${e.candidate.type} ${e.candidate.address ?? "?"}:${e.candidate.port ?? "?"}`);
        };
        this.pc.oniceconnectionstatechange = () => {
          const s = this.pc.iceConnectionState;
          log(`[${tag}] ICE 연결 상태: ${s}`);
          if (s === "checking") onState("punching");
          else if (s === "connected" || s === "completed") onState("ice-connected");
          else if (s === "disconnected") onState("disconnected");
          else if (s === "failed") onState("failed", { reason: "ICE 실패" });
        };
      }

      // 호출하는 쪽: offer SDP 생성
      // keepHost = true: host 후보를 남긴다 (같은 네트워크). false: 지운다 (srflx로만 연결)
      async createOffer(keepHost) {
        this.setupChannel(this.pc.createDataChannel("punch"));
        await this.pc.setLocalDescription(await this.pc.createOffer());
        await waitGathering(this.pc);
        return this.localSdp(keepHost);
      }

      // 응답하는 쪽: offer를 받아 answer SDP 생성 (keepHost는 offer를 보낸 쪽의 판단을 따른다)
      async createAnswer(offerSdp, keepHost) {
        this.pc.ondatachannel = (e) => this.setupChannel(e.channel);
        await this.pc.setRemoteDescription({ type: "offer", sdp: offerSdp });
        await this.pc.setLocalDescription(await this.pc.createAnswer());
        await waitGathering(this.pc);
        return this.localSdp(keepHost);
      }

      async acceptAnswer(answerSdp) {
        await this.pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
      }

      localSdp(keepHost) {
        const raw = this.pc.localDescription.sdp;
        if (keepHost) {
          const count = raw.split("\r\n").filter((l) => l.startsWith("a=candidate:")).length;
          log(`[${this.tag}] 같은 네트워크: host 후보 유지, 후보 ${count}개`);
          if (count === 0) throw new Error("후보 없음");
          return raw;
        }
        const { sdp, removed, kept } = stripHostCandidates(raw);
        log(`[${this.tag}] host 후보 ${removed}개 제거, 남은 후보 ${kept}개`);
        if (kept === 0) throw new Error("공인 주소 후보 없음 (STUN 응답 실패)");
        return sdp;
      }

      setupChannel(ch) {
        this.ch = ch;
        ch.onopen = async () => {
          log(`[${this.tag}] DataChannel open`);
          const pair = await this.selectedPair();
          this.onState("connected", { pair });
          if (this.isCaller) this.ping();
        };
        ch.onclose = () => {
          log(`[${this.tag}] DataChannel close`);
          this.onState("closed");
        };
        ch.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === "ping") {
            log(`[${this.tag}] ping 수신 → pong 전송`);
            ch.send(JSON.stringify({ type: "pong", t: msg.t }));
          } else if (msg.type === "pong") {
            const rtt = performance.now() - msg.t;
            log(`[${this.tag}] pong 수신 (왕복 ${rtt.toFixed(1)}ms)`);
            this.onState("rtt", { rtt });
          }
        };
      }

      ping() {
        if (this.ch?.readyState === "open") this.ch.send(JSON.stringify({ type: "ping", t: performance.now() }));
      }

      // 선택된 후보 쌍 ("srflx 1.2.3.4:5 ↔ srflx 6.7.8.9:10")
      async selectedPair() {
        const stats = await this.pc.getStats();
        let pair = null;
        stats.forEach((s) => {
          if (s.type === "transport" && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId);
        });
        if (!pair) {
          // Firefox: transport에 selectedCandidatePairId가 없음
          stats.forEach((s) => {
            if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") pair = s;
          });
        }
        if (!pair) return null;
        const fmt = (c) => `${c.candidateType} ${c.address ?? c.ipAddress ?? ""}:${c.port ?? c.portNumber}`;
        const text = `${fmt(stats.get(pair.localCandidateId))} ↔ ${fmt(stats.get(pair.remoteCandidateId))}`;
        log(`[${this.tag}] 선택된 후보 쌍: ${text}`);
        return text;
      }

      close() {
        this.pc.close();
      }
    }

    function waitGathering(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const timer = setTimeout(resolve, GATHER_TIMEOUT_MS);
        pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") {
            clearTimeout(timer);
            resolve();
          }
        });
      });
    }

    function stripHostCandidates(sdp) {
      let removed = 0;
      let kept = 0;
      const lines = sdp.split("\r\n").filter((line) => {
        if (!line.startsWith("a=candidate:")) return true;
        if (/ typ host( |$)/.test(line)) {
          removed++;
          return false;
        }
        kept++;
        return true;
      });
      return { sdp: lines.join("\r\n"), removed, kept };
    }

    // 내 공인 주소 확인 (STUN에 한 번 물어본다)
    async function probePublicIp() {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      const ips = new Set();
      pc.onicecandidate = (e) => {
        if (e.candidate?.type === "srflx" && e.candidate.address) ips.add(e.candidate.address);
      };
      pc.createDataChannel("probe");
      await pc.setLocalDescription(await pc.createOffer());
      await waitGathering(pc);
      pc.close();
      const list = [...ips];
      return list.find((ip) => !ip.includes(":")) ?? list[0] ?? null;
    }

    // ===== 상대별 연결 상태 =====
    const peers = new Map();    // 상대 id → { id, name, device, ip }   (로비에 있는 기기)
    const sessions = new Map(); // 상대 id → { sid, role, answered, punch, state, detail, timer }

    function newSession(peerId, role, sid = newId()) {
      const tag = peers.get(peerId)?.name ?? peerId;
      const s = { sid, role, answered: false, state: null, detail: {} };
      s.punch = new Punch(role === "caller", tag, (state, detail) => {
        if (sessions.get(peerId) === s) setState(peerId, state, detail);
      });
      s.timer = setTimeout(() => {
        if (sessions.get(peerId) === s && s.state !== "connected") setState(peerId, "failed", { reason: "시간 초과" });
      }, CONNECT_TIMEOUT_MS);
      sessions.set(peerId, s);
      return s;
    }

    function endSession(peerId) {
      const s = sessions.get(peerId);
      if (!s) return;
      clearTimeout(s.timer);
      sessions.delete(peerId); // 먼저 지워서 close 이후 이벤트를 무시한다
      s.punch.close();
    }

    function setState(peerId, state, detail = {}) {
      const s = sessions.get(peerId);
      if (!s) return;
      if (state === "rtt") {
        s.detail.rtt = detail.rtt;
      } else if (state === "ice-connected") {
        if (s.state === "disconnected") s.state = "connected";
      } else if (state === "punching") {
        if (s.state !== "connected") s.state = "punching";
      } else if (state === "disconnected" && s.state !== "connected") {
        s.state = "failed";
        s.detail.reason = "상대에게 닿지 않음";
      } else if (state === "closed") {
        if (s.state === "connected") s.state = "closed";
      } else {
        s.state = state;
        Object.assign(s.detail, detail);
      }
      if (s.state === "connected" || s.state === "failed") clearTimeout(s.timer);
      render();
    }

    // ===== 로비 (Supabase Realtime: presence로 목록, broadcast로 시그널링) =====
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);
    const lobby = db.channel("lobby", { config: { presence: { key: me.id }, broadcast: { self: false } } });
    let subscribed = false;

    const track = () => lobby.track({ id: me.id, name: me.name, device: me.device, ip: me.ip });
    const send = (msg) => lobby.send({ type: "broadcast", event: "signal", payload: { ...msg, from: me.id } });

    lobby.on("presence", { event: "sync" }, () => {
      peers.clear();
      for (const [key, metas] of Object.entries(lobby.presenceState())) {
        if (key === me.id || !metas.length) continue;
        peers.set(key, metas[metas.length - 1]);
      }
      render();
    });

    lobby.on("broadcast", { event: "signal" }, ({ payload }) => {
      if (payload?.to === me.id) run(handleSignal)(payload);
    });

    lobby.subscribe((status) => {
      log(`로비 상태: ${status}`);
      $("lobby-status").textContent = status === "SUBSCRIBED" ? "로비 접속됨" : `로비: ${status}`;
      subscribed = status === "SUBSCRIBED";
      if (subscribed) track();
    });

    run(async () => {
      me.ip = await probePublicIp();
      $("me-ip").textContent = me.ip ?? "확인 실패";
      log(`내 공인 주소: ${me.ip ?? "확인 실패"}`);
      if (subscribed) track();
      render();
    })();

    // 목록에서 상대를 눌렀을 때
    async function connectTo(peerId) {
      // 상대 공인 IP가 내 공인 IP와 같으면 같은 네트워크 방식(host 후보 유지)으로 연결한다
      const local = sameNetwork(peers.get(peerId) ?? {});
      endSession(peerId);
      const s = newSession(peerId, "caller");
      setState(peerId, "gathering");
      try {
        const sdp = await s.punch.createOffer(local);
        if (sessions.get(peerId) !== s) return;
        await send({ to: peerId, kind: "offer", sid: s.sid, sdp, local });
        log(`[${s.punch.tag}] offer 전송 (${local ? "같은 네트워크 방식" : "공인 주소 방식"}) → answer 대기`);
        setState(peerId, "waiting");
      } catch (e) {
        setState(peerId, "failed", { reason: e.message });
        throw e;
      }
    }

    async function handleSignal({ from, kind, sid, sdp, local }) {
      if (kind === "offer") {
        const cur = sessions.get(from);
        // 양쪽이 동시에 누른 경우: id가 작은 쪽의 offer만 살린다
        if (cur?.role === "caller" && !cur.answered && me.id < from) {
          log("동시 연결 시도: 내 offer를 유지");
          return;
        }
        endSession(from);
        const s = newSession(from, "callee", sid);
        log(`[${s.punch.tag}] offer 수신 → answer 생성`);
        setState(from, "gathering");
        try {
          const answer = await s.punch.createAnswer(sdp, local === true);
          if (sessions.get(from) !== s) return;
          await send({ to: from, kind: "answer", sid, sdp: answer });
          log(`[${s.punch.tag}] answer 전송`);
          setState(from, "punching");
        } catch (e) {
          setState(from, "failed", { reason: e.message });
          throw e;
        }
      } else if (kind === "answer") {
        const s = sessions.get(from);
        if (!s || s.role !== "caller" || s.sid !== sid || s.answered) return;
        s.answered = true;
        log(`[${s.punch.tag}] answer 수신 → 적용`);
        await s.punch.acceptAnswer(sdp);
        setState(from, "punching");
      }
    }

    // ===== 화면 =====
    const STATE_TEXT = {
      gathering: ["공인 주소 확인 중…", "warn"],
      waiting: ["상대 응답 기다리는 중…", "warn"],
      punching: ["홀 펀칭 시도 중…", "warn"],
      connected: ["연결됨", "ok"],
      disconnected: ["연결 끊김", "err"],
      failed: ["실패", "err"],
      closed: ["연결 종료", "muted"],
    };

    const sameNetwork = (p) => Boolean(me.ip && p.ip && me.ip === p.ip);

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text; // 상대가 보낸 값은 textContent로만 넣는다
      return e;
    }

    function render() {
      const ul = $("peers");
      ul.replaceChildren();
      $("empty").hidden = peers.size > 0;

      for (const [id, p] of peers) {
        const s = sessions.get(id);
        const li = el("li", "peer");
        const info = el("div", "info");

        const name = el("div", "name", p.name ?? id);
        if (sameNetwork(p)) name.append(el("span", "badge", "같은 네트워크"));
        info.append(name, el("div", "label", [p.device, p.ip].filter(Boolean).join(" · ")));

        if (s?.state) {
          const [text, cls] = STATE_TEXT[s.state] ?? [s.state, "muted"];
          let line = text;
          if (s.state === "connected") {
            if (s.detail.pair) line += ` · ${s.detail.pair}`;
            if (s.detail.rtt != null) line += ` · 왕복 ${s.detail.rtt.toFixed(1)}ms`;
          }
          if (s.state === "failed") {
            if (s.detail.reason) line += ` (${s.detail.reason})`;
            if (sameNetwork(p)) line += " · 같은 네트워크: 공유기가 기기 사이 통신을 막고 있을 수 있습니다";
          }
          info.append(el("div", `status ${cls}`, line));
        }

        const btn = el("button");
        if (s?.state === "connected") {
          btn.textContent = "핑";
          btn.className = "ghost";
          btn.onclick = () => s.punch.ping();
        } else if (s && !["failed", "disconnected", "closed"].includes(s.state)) {
          btn.textContent = "시도 중";
          btn.disabled = true;
        } else {
          btn.textContent = s ? "다시 시도" : "연결";
          btn.onclick = run(() => connectTo(id));
        }

        li.append(info, btn);
        ul.append(li);
      }
    }

    render();
  </script>
</body>
</html>
